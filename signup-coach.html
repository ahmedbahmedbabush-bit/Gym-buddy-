<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymBuddy - Coach Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">

    <h1>👩‍🏫 Welcome, Coach!</h1>

    <h2>Create Your Coach Account</h2>

    <p>Let's build your coaching space! 💜</p>

    <input type="text" id="fullName" placeholder="👤 Full Name">

    <input type="email" placeholder="📧 Email">

    <input type="password" placeholder="🔒 Password">

    <button onclick="location.href='coach-profile.html'">
        💜 Continue
    </button>

    <p class="small-text">
        Already have a coach account?
    </p>

    <a href="signin-coach.html" class="signin-link">
        💙 Sign In
    </a>

</div>

</body>
</html>
