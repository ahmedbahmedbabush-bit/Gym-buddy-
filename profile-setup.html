<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymBuddy - Athlete Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">

<h1>🎉 You're Almost Ready!</h1>

<h2>🤸 Let's Get to Know You!</h2>

<p class="progress-text">Step 2 of 4 🌟</p>

<div class="progress-bar">
    <div class="progress-fill"></div>
</div>

<p>Buddy wants to personalize your GymBuddy experience! 💜</p>

<p><strong>🎂 Age</strong></p>
<input type="number" placeholder="Enter your age">

<p><strong>📏 Height</strong></p>
<input type="number" placeholder="Enter your height">

<select>
    <option>cm</option>
    <option>ft / in</option>
</select>

<p><strong>⚖️ Weight</strong></p>
<input type="number" placeholder="Enter your weight">

<select>
    <option>kg</option>
    <option>lb</option>
</select>

<br><br>

<button onclick="location.href='dashboard.html'">
💜 Continue
</button>

</div>

</body>
</html>
